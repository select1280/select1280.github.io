<aside id="weather-bar" class="weather-bar" aria-label="城市天氣">
  <div class="weather-primary">
    <label for="weather-city">今日天氣</label>
    <select id="weather-city" aria-label="選擇天氣城市"></select>
    <span class="weather-status" role="status" aria-live="polite">天氣載入中…</span>
    <button type="button" hidden>重試</button>
  </div>
  <div class="weather-secondary">
    <time></time>
    <a href="https://open-meteo.com/" target="_blank" rel="noopener" title="Open-Meteo 天氣模式資料，依城市中心座標查詢，非即時測站觀測">Open-Meteo ↗</a>
  </div>
</aside>
